<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  model-viewer { width: 100%; height: 100%; background: #f4f4f4; }
</style>
</head>
<body>
<model-viewer id="mv" camera-controls auto-rotate
  shadow-intensity="1" exposure="1" environment-image="neutral"
  ar ar-modes="webxr scene-viewer quick-look"
  touch-action="pan-y"></model-viewer>
<script>
  const nom = new URLSearchParams(location.search).get('m') || 'modele.glb';
  document.getElementById('mv').src = nom.split('/').pop();
</script>
</body>
</html>
